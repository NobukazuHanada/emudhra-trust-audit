name: Skill checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Static checks and POSIX catalogue blocks
        run: bash scripts/validate.sh posix
  windows:
    runs-on: windows-latest
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Windows PowerShell catalogue blocks (via Git Bash, as documented)
        shell: bash
        run: bash scripts/validate.sh windows
