name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --all-targets
      - name: Build standalone executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target "$TARGET"
      - name: Smoke test and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="$PWD/target/$TARGET/release/emudhra-trust-audit$SUFFIX"
          "$binary" data --verify
          sh scripts/package.sh "$TARGET" "$binary" release-output
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-output/*.tar.gz
          if-no-files-found: error
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets
      - name: Generate archive checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-with-checksums
          path: release-assets/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets-with-checksums
          path: release-assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes
