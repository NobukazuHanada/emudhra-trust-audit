[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emudhra-trust-audit"
version = "0.1.0"
description = "Read-only auditor for compromised CA trust on developer endpoints and in project repositories"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The emudhra-trust-audit contributors" }]
keywords = ["security", "tls", "pki", "certificate-authority", "audit", "agent-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/NobukazuHanada/emudhra-trust-audit"
Issues = "https://github.com/NobukazuHanada/emudhra-trust-audit/issues"

[project.scripts]
emudhra-trust-audit = "ca_trust_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca_trust_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run the suite straight from a checkout, with no installation step.
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM105", "UP006", "UP035", "UP045", "UP031", "UP036", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
